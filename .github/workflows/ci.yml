name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test:ci
        env:
          JWT_SECRET: ci_test_jwt_secret
          REFRESH_SECRET: ci_test_refresh_secret
          SESSION_SECRET: ci_test_session_secret
